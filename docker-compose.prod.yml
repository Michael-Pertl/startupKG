services:
  web:
    build:
      context: ./web
      args:
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
        VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:-}"
    container_name: ai-market-graph-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: 8080
      ASK_AUTH_PROVIDER: "${ASK_AUTH_PROVIDER:-local}"
      ASK_REQUIRE_AUTH: "${ASK_REQUIRE_AUTH:-false}"
      ASK_ACCESS_TOKENS: "${ASK_ACCESS_TOKENS:-}"
      ASK_CREDIT_USERS: "${ASK_CREDIT_USERS:-}"
      ASK_CREDITS_PER_PROMPT: "${ASK_CREDITS_PER_PROMPT:-1}"
      ASK_MAX_REQUESTS_PER_MINUTE: "${ASK_MAX_REQUESTS_PER_MINUTE:-8}"
      NEBIUS_API_KEY: "${NEBIUS_API_KEY:-}"
      NEBIUS_MODEL: "${NEBIUS_MODEL:-moonshotai/Kimi-K2.5}"
      NEBIUS_BASE_URL: "${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://127.0.0.1:8080}"
